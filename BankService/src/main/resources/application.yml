server:
  port: 8083

spring:
  main:
    banner-mode: "off"
  application:
    name: BankService

logging:
  level:
    root: WARN
    com.observe.bank: INFO

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
