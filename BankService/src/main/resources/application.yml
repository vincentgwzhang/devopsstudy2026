server:
  port: 8083

spring:
  main:
    banner-mode: "off"
  application:
    name: BankService

logging:
  level:
    root: WARN
    com.observe.bank: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
