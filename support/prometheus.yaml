services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: devopsstudy-otel-collector
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: devopsstudy-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector
    restart: unless-stopped
