services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: devopsstudy-zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: devopsstudy-jaeger
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: devopsstudy-otel-collector
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
    depends_on:
      - zipkin
      - jaeger
    restart: unless-stopped
