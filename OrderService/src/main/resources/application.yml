server:
  port: 8081

spring:
  main:
    banner-mode: "off"
  application:
    name: OrderService

logging:
  level:
    root: WARN
    com.observe.order: INFO

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
        
services:
  payment:
    url: http://localhost:8082
