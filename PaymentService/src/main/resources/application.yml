server:
  port: 8082

spring:
  main:
    banner-mode: "off"
  application:
    name: PaymentService

logging:
  level:
    root: WARN
    com.observe.payment: INFO

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
        
services:
  bank:
    url: http://localhost:8083
