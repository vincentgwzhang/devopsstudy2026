server:
  port: 8082

spring:
  main:
    banner-mode: "off"
  application:
    name: PaymentService

logging:
  level:
    root: WARN
    com.observe.payment: INFO

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
        
services:
  bank:
    url: http://localhost:8083
