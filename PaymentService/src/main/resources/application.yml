server:
  port: 8082

spring:
  main:
    banner-mode: "off"
  application:
    name: PaymentService

logging:
  level:
    root: WARN
    com.observe.payment: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

services:
  bank:
    url: http://localhost:8083
